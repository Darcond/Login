name: CI-CD-Workflow
on:
  push:
    branches:
      - main

jobs:
  job_version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar Archivo
        run: |
          echo "Version: 1.0.${{ github.run_number }}" > VERSION.txt
          echo "Update: $(date)" >> VERSION.txt
      - name: Auto Commit
        run: |
          git config --local user.name 'github-actions[bot]'
          git config --local user.email 'github-actions[bot]@users.noreply.github.com'
          git add VERSION.txt
          git commit -m 'Auto-update version [skip ci]' || echo "Sin cambios"
          git push origin main

  job_release:
    runs-on: ubuntu-latest
    needs: job_version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Crear Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: "Versión generada automáticamente."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}